<text x="792.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Key Vault authorization</text>
<text x="792.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Keeps the mailbox owner's saved</text>
<text x="792.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">authorization protected.</text>
</g>
