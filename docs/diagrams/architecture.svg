<title id="title">Gmail-assisted connection recovery — illustrated architecture</title>
<desc id="desc">Actual direct API path, independent of the failed connector. Regular browser sign-ins can create competing messages. Direct Gmail access avoided the connector but did not fix document-ingestion commissioning.</desc>
