<text x="600.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Direct Gmail API</text>
<text x="600.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Reads candidate messages from the intended</text>
<text x="600.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">Gmail inbox.</text>
</g>
<g data-node="n3_0"><rect x="425.0" y="880" width="350" height="170" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" />
