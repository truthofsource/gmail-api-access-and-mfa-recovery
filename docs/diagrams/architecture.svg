<text x="600.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Message and timing checks</text>
<text x="600.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Rejects old, reused or competing</text>
<text x="600.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">verification codes.</text>
</g>
